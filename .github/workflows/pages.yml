# GitHub Pages에 화면(public/)만 올립니다. "혼자 보기" 모드로 동작하며,
# public/config.js에 서버 주소를 적으면 함께 보기도 켜집니다.
# 사용하려면: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾸세요.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
